[project]
name = "codex-seo"
version = "2.6.0"
description = "Codex-native SEO auditing and strategy workflow"
requires-python = ">=3.11"
license = "MIT"
readme = "README.md"
authors = [
  {name = "Daniel Agrici"}
]
keywords = ["seo", "codex", "ai-tools", "schema-markup", "e-e-a-t", "geo"]

[project.urls]
Homepage = "https://github.com/kimjindol2025/codex-seo"
Repository = "https://github.com/kimjindol2025/codex-seo"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "W", "I"]
ignore = ["E501"]
